apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: scripts
  namespace: default
spec:
  repository: hono-pds
  upstream: self
  dependsOn:
  - sc.hono-pds
  intent: 'This context exists to keep the PDS compute isolated from its transport:
    the application and its storage run inside a Deno Worker with an explicit, minimal
    permission set, while the main thread owns the network and the CLI surface. createPdsSandbox
    is the seam that lets tests and scripts drive the full PDS through a normal fetch(Request)
    API without the worker ever touching the network itself, and worker-launcher.ts
    is the compute-only counterpart that speaks the init/request/shutdown message
    protocol. run-worker.ts and bundle.sh exist so the same sandbox can be exercised
    interactively, served over HTTP for local use, or bundled into a single deployable
    artifact.'
  requirements:
  - id: r.bundle-frozen-build
    level: SHOULD
    text: bundle.sh resolves its own directory, changes to the repository root, installs
      dependencies frozen against ./trusted-deno.json, and bundles main.ts to bundle.js
      with the same frozen config, failing the script on any error via set -euo pipefail.
    codeRefs:
    - file:scripts/bundle.sh
  - id: r.run-worker-cli-surface
    level: MUST
    text: 'run-worker.ts takes one optional positional argument, the HTTP port, parsed
      with parseInt and defaulting to 0 when absent: a port greater than 0 starts
      Deno.serve bound to 127.0.0.1 on that port with requests forwarded to the sandbox''s
      fetch, while the default 0 selects interactive mode, which exposes the sandbox
      as globalThis.pds and waits forever; the entrypoint is run under deno run -A
      --unstable-kv --unstable-worker-options.'
    codeRefs:
    - file:scripts/run-worker.ts
  - id: r.run-worker-signal-shutdown
    level: MUST
    text: run-worker.ts registers SIGINT and SIGTERM listeners that log, call the
      sandbox's shutdown, and exit with code 0 once shutdown resolves.
    codeRefs:
    - file:scripts/run-worker.ts
    - function:de2941b3a7c432edebcb7aedc17dacfd
  - id: r.sandbox-fetch-request-correlation
    level: MUST
    text: The fetch function returned by createPdsSandbox assigns each request a monotonically
      increasing numeric id, posts the method, url, header entries and body bytes
      (or null when the request has no body) to the worker, and returns a promise
      that resolves only when a response message carrying that same id arrives; the
      response message's status, headers and body are used to construct the returned
      Response and the pending entry is removed.
    codeRefs:
    - file:scripts/sandbox.ts
    - function:1e8a394a85efb094e83417600cb5d9c6
    - function:7c88be26c839763d478fc66921bff4ad
  - id: r.sandbox-init-handshake
    level: MUST
    text: 'createPdsSandbox posts an init message to the worker and awaits its reply:
      a ready message resolves the initialization promise, an error message rejects
      it with the reported message text, so a worker that fails to construct the app
      surfaces as a rejected createPdsSandbox call rather than a silently dead sandbox.'
    codeRefs:
    - file:scripts/sandbox.ts
    - function:1e8a394a85efb094e83417600cb5d9c6
  - id: r.sandbox-interface-shape
    level: MUST
    text: 'PdsSandbox is the contract createPdsSandbox fulfils: a fetch taking a Request
      and returning a Promise<Response>, and a shutdown taking no arguments and returning
      a Promise<void>, which is the entire surface callers such as run-worker.ts depend
      on.'
    codeRefs:
    - file:scripts/sandbox.ts
    - function:1e8a394a85efb094e83417600cb5d9c6
    - interface:76792809058bca60ee2f8020cd282718
  - id: r.sandbox-permission-scope
    level: MUST
    text: createPdsSandbox creates the persistent Deno worker with an explicit permission
      set that passes through only the PDS_PRIVATE_KEY_HEX, PDS_DID_WEB_SERVICES and
      MIN_LOG_LEVEL environment variables and restricts filesystem read and write
      access to the .kv directory, so the worker never receives ambient env or filesystem
      access.
    codeRefs:
    - file:scripts/sandbox.ts
    - function:1e8a394a85efb094e83417600cb5d9c6
  - id: r.sandbox-shutdown-sequence
    level: MUST
    text: The shutdown function returned by createPdsSandbox posts a shutdown message
      to the worker, waits 200 milliseconds, and only then awaits the worker's own
      shutdown, so the worker has a window to flush and close before the handle is
      torn down.
    codeRefs:
    - file:scripts/sandbox.ts
    - function:de2941b3a7c432edebcb7aedc17dacfd
  - id: r.worker-init-and-dispatch
    level: MUST
    text: worker-launcher.ts builds the application once via createFromEnv() from
      main.ts on the init message and answers ready on success or error with the failure
      text on failure; on each request message it reconstructs a Request from the
      posted method, url, headers and optional body bytes, calls app.fetch, and replies
      with a response message carrying the same id plus status, header entries and
      body bytes, replying status 500 with an empty header list and null body when
      the app is not yet initialized or the call throws.
    codeRefs:
    - file:scripts/worker-launcher.ts
  - id: r.worker-shutdown-close
    level: MUST
    text: On a shutdown message the worker replies with a stopped message and closes
      itself, so the launcher terminates without the main thread having to kill it.
    codeRefs:
    - file:scripts/worker-launcher.ts
  interfaces:
  - name: PdsSandbox
    kind: interface
    signature: 'interface PdsSandbox { fetch: (req: Request) => Promise<Response>;
      shutdown: () => Promise<void>; }'
    file: scripts/sandbox.ts
  - name: createPdsSandbox
    kind: function
    signature: 'createPdsSandbox(): Promise<PdsSandbox>'
    file: scripts/sandbox.ts
  - name: fetch
    kind: function
    signature: 'fetch(req: Request): Promise<Response>'
    file: scripts/sandbox.ts
  - name: shutdown
    kind: function
    signature: shutdown()
    file: scripts/sandbox.ts
codeRefIndex:
- file:scripts/bundle.sh bundle.sh@scripts/bundle.sh
- file:scripts/run-worker.ts run-worker.ts@scripts/run-worker.ts
- file:scripts/sandbox.ts sandbox.ts@scripts/sandbox.ts
- file:scripts/worker-launcher.ts worker-launcher.ts@scripts/worker-launcher.ts
- function:1e8a394a85efb094e83417600cb5d9c6 createPdsSandbox@scripts/sandbox.ts:9
- function:7c88be26c839763d478fc66921bff4ad fetch@scripts/sandbox.ts:54
- function:de2941b3a7c432edebcb7aedc17dacfd shutdown@scripts/sandbox.ts:72
- interface:76792809058bca60ee2f8020cd282718 PdsSandbox@scripts/sandbox.ts:4
