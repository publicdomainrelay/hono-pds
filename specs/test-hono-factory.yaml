apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test-hono-factory
  namespace: default
spec:
  repository: hono-pds
  upstream: self
  dependsOn:
  - sc.hono-pds
  intent: 'This context exists to pin the observable HTTP and API behaviour of the
    repo factory: that its XRPC routes answer with AT Protocol-shaped payloads (uri
    plus cid on writes, value on reads, collections plus head on describeRepo, cursor
    on paginated lists), that its subscribe handler delivers a SequencedFrame carrying
    the committed ops and can be disposed, and that write responses report the record
    CID rather than the commit CID so that strongRefs built from a write address the
    same bytes a later getRecord or listRecords returns. It is the regression net
    for the factory''s public surface, including the fix that createRecord and putRecord
    no longer answer with the commit CID, and it is the place a change to factory
    routing, auth, or CID reporting is expected to show up as a failing test.'
  requirements:
  - id: r.e2e-create-record-returns-uri-and-cid
    level: MUST
    text: Posting to /xrpc/com.atproto.repo.createRecord with a valid service-auth
      Bearer token must answer 200 with a body whose uri is at://<did>/<collection>/<rkey>
      and whose cid is a string.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-describe-repo-lists-collections
    level: MUST
    text: GET /xrpc/com.atproto.repo.describeRepo must answer 200 with the set of
      collections holding records for that repo and a head value identifying the current
      commit.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-factory-standup-in-memory
    level: MUST
    text: Every test must be able to stand up a working factory from only a Storage
      (MemoryStorage) and a Signer by calling createRepoFactory, with no OAuth server,
      admin password or external PLC dependency configured.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-get-record-returns-stored-value
    level: MUST
    text: A record written through factory.api.applyWrites must be readable back through
      GET /xrpc/com.atproto.repo.getRecord with repo, collection and rkey query parameters,
      answering 200 with uri, cid and a value equal to the stored record.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-list-records-paginates
    level: MUST
    text: GET /xrpc/com.atproto.repo.listRecords must honour the limit query parameter,
      returning at most that many records in an array and a cursor when more records
      remain in the collection.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-service-auth-token-per-request
    level: MUST
    text: Authenticated write calls must mint a fresh service-auth JWT per request
      by signing with the signer from factory.getUserSigner(did), because a token
      issued for one call is not reusable for another.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-subscribe-emits-sequenced-frame
    level: MUST
    text: factory.subscribe must invoke the supplied handler with a SequencedFrame
      after a write commits, whose repo equals the account DID, whose ops array holds
      one entry with action create and path <collection>/<rkey>, and must return a
      dispose function that stops delivery.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
  - id: r.e2e-write-cid-is-record-cid
    level: MUST
    text: The cid returned by createRecord and putRecord must equal the cid that getRecord
      and listRecords report for the same record, and a putRecord that changes the
      record body must produce a different cid than the createRecord it replaced.
    codeRefs:
    - file:test/hono-factory/e2e_test.ts
codeRefIndex:
- file:test/hono-factory/e2e_test.ts e2e_test.ts@test/hono-factory/e2e_test.ts
