apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test
  namespace: default
spec:
  repository: hono-pds
  upstream: self
  dependsOn:
  - sc.hono-pds
  intent: 'This context exists to pin down what the repository''s automated tests
    actually assert, so that implementation changes elsewhere in hono-pds can be checked
    against the contracts the suite already enforces. It is the executable definition
    of the PDS''s external surface as the tests see it: the CLI must start and accept
    `--help`, the health route must answer over HTTP with a version string, and the
    record-write path must accept an account creation, a service-auth JWT scoped to
    the PDS DID, and a `createRecord` call, returning the created record''s URI and
    CID. It also fixes the test harness conventions — ephemeral ports, deterministic
    teardown, per-test keypairs — that keep the suite hermetic and cheap to run in
    CI.'
  requirements:
  - id: r.account-then-service-auth
    level: MUST
    text: Before the authenticated write, the test creates an account through POST
      /xrpc/com.atproto.server.createAccount, reads the returned DID, retrieves that
      account's signer from the factory (throwing if absent), and derives the Bearer
      token by signing a service-auth JWT for that signer.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.cli-help-exits-zero
    level: MUST
    text: The CLI smoke test spawns `deno run -A main.ts --help` with the repository
      root as the working directory and captures both stdout and stderr; the process
      must exit with code 0, so `--help` is handled without error.
    codeRefs:
    - file:test/cli_smoke_test.ts
  - id: r.create-record-over-http
    level: MUST
    text: 'An integration test posts to /xrpc/com.atproto.repo.createRecord with a
      JSON body carrying `repo`, `collection` and `record`, presents a service-auth
      JWT as `Authorization: Bearer <token>`, and asserts status 200 with both `uri`
      and `cid` present in the JSON response.'
    codeRefs:
    - file:test/integration_test.ts
  - id: r.ephemeral-port-binding
    level: MUST
    text: Each HTTP integration test binds port 0 and resolves the actual listening
      port from the server's onListen callback before issuing any fetch, keeping tests
      free of fixed-port collisions.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.fresh-signer-and-memory-storage
    level: MUST
    text: Every test constructs its factory from a newly generated Secp256k1 keypair
      wrapped by signerFromKeypair and from a fresh MemoryStorage instance, so tests
      share no signer, no repository state and no persistence.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.health-route-over-http
    level: MUST
    text: An integration test serves the factory's fetch handler on an HTTP port and
      asserts that GET /xrpc/_health responds with status 200 and a JSON body containing
      an existing, non-null `version` field.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.in-process-app-request
    level: SHOULD
    text: Account creation in the integration test goes through `factory.app.request`
      directly against the Hono app rather than over the network, while record writes
      go over real HTTP, exercising both the in-process and served paths.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.published-package-imports
    level: SHOULD
    text: The integration test imports createRepoFactory, MemoryStorage, signerFromKeypair
      and signServiceAuth from the published JSR packages (@publicdomainrelay/hono-factory-atproto-repo-deno
      and @publicdomainrelay/atproto-repo-deno), with Secp256k1Keypair from @atproto/crypto,
      so the suite tests the packages as consumers receive them.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.server-teardown-in-finally
    level: MUST
    text: Each HTTP integration test aborts its AbortController and awaits the server's
      `finished` promise inside a `finally` block, so the listener is torn down even
      when an assertion fails.
    codeRefs:
    - file:test/integration_test.ts
  - id: r.service-auth-audience-is-pds-did
    level: MUST
    text: The signed service-auth token sets its audience to the PDS signer's own
      DID, so the token is issued for the PDS the record is written to rather than
      for the account.
    codeRefs:
    - file:test/integration_test.ts
codeRefIndex:
- file:test/cli_smoke_test.ts cli_smoke_test.ts@test/cli_smoke_test.ts
- file:test/integration_test.ts integration_test.ts@test/integration_test.ts
