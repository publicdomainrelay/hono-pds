apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: test-atproto-repo-deno
  namespace: default
spec:
  repository: hono-pds
  upstream: self
  dependsOn:
  - sc.hono-pds
  intent: 'These tests exist to pin down the observable behavior of the Repo API and
    its storage backends so that changes to the MST, commit, or storage layers cannot
    silently break record durability, pagination, or head tracking. The concurrency
    test in particular exists because a commit is a read-modify-write over the repo
    head: without serialization, interleaved applyWrites build the MST from the same
    root and the last setHead silently drops the other''s records while still reporting
    success. The suite is the executable contract the lib layer must satisfy.'
  requirements:
  - id: r.denokv-storage-exported
    level: MUST
    text: The package entrypoint must export DenoKvStorage as a function value so
      consumers can instantiate the Deno KV backed storage.
    codeRefs:
    - file:test/atproto-repo-deno/storage_test.ts
  - id: r.repo-applywrites-actions
    level: MUST
    text: applyWrites must echo the action performed in ops[0].action for each of
      the create, update, and delete actions when applied in sequence to the same
      collection and rkey.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.repo-concurrent-writes-preserved
    level: MUST
    text: Concurrent applyWrites calls issued via Promise.all against a single DID
      must serialize so that every written record remains readable afterwards, listRecords
      reports the full count, and each commit carries its own distinct rev rather
      than forking off a shared parent.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.repo-create-get-roundtrip
    level: MUST
    text: applyWrites with action "create" must return a result carrying a non-null
      commit, a non-null rev, and an ops array whose single entry has action "create";
      a subsequent getRecord for that collection and rkey must return the stored value
      with uri of the form at://<did>/<collection>/<rkey> and value deep-equal to
      the record that was written.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.repo-delete-record
    level: MUST
    text: Deleting a previously created record via applyWrites with action "delete"
      must make a subsequent getRecord for that collection and rkey return null.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.repo-describe-collections
    level: MUST
    text: describe must return an empty collections array and a null head for a repo
      with no commits, and after writes to two distinct collections must return a
      non-null head and the collection names sorted lexicographically.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.repo-list-pagination
    level: MUST
    text: listRecords must honor a limit option and, when more records remain, return
      a non-null cursor; passing that cursor back with a larger limit must return
      exactly the remaining records without repeating those already returned.
    codeRefs:
    - file:test/atproto-repo-deno/repo_test.ts
  - id: r.storage-has-and-missing
    level: MUST
    text: MemoryStorage.has must return false for an unknown CID and true after a
      put; get for an unknown CID must return null rather than throwing.
    codeRefs:
    - file:test/atproto-repo-deno/storage_test.ts
  - id: r.storage-head-roundtrip
    level: MUST
    text: MemoryStorage.getHead must return null for a DID with no stored head, and
      after setHead must return a head whose commit and rev match what was set.
    codeRefs:
    - file:test/atproto-repo-deno/storage_test.ts
  - id: r.storage-put-get-roundtrip
    level: MUST
    text: MemoryStorage.get must return exactly the bytes previously stored by put
      for a given CID, and re-putting a CID must overwrite the prior value so that
      get returns the newest bytes.
    codeRefs:
    - file:test/atproto-repo-deno/storage_test.ts
codeRefIndex:
- file:test/atproto-repo-deno/repo_test.ts repo_test.ts@test/atproto-repo-deno/repo_test.ts
- file:test/atproto-repo-deno/storage_test.ts storage_test.ts@test/atproto-repo-deno/storage_test.ts
