apiVersion: specs.publicdomainrelay.dev/v1alpha1
kind: SystemContext
metadata:
  name: lib-hono-factory-atproto-repo-deno
  namespace: default
spec:
  repository: hono-pds
  upstream: self
  dependsOn:
  - sc.hono-pds
  intent: 'This context exists so a Deno host process can stand up a self-contained
    AT Protocol PDS over Hono from a small set of injected contracts (Storage, Signer,
    Did, Sequencer): the factory owns route registration, identity documents, authentication,
    and the credential-minting endpoints, while the sequencer and subscribe layers
    own the firehose event stream that relays and watchers consume. It keeps transport
    concerns (HTTP, auth, well-known) separate from the ABC-layer repo/account contracts
    so tests and alternative hosts can substitute implementations.'
  requirements:
  - id: r.account-creation
    level: MUST
    text: The createAccount route must parse the request JSON, and when plcDirectoryUrl
      is configured generate a secp256k1 keypair, resolve the PDS authority from publicHostname
      or the Host header (400 when neither is available), pick http for localhost/loopback
      authorities and https otherwise, build and POST a PLC genesis op, and fail with
      500 when the PLC directory rejects it; on success it must register the account
      with the account store, record the signer under the account DID, bootstrap an
      empty repo via applyWrites, and return accessJwt, refreshJwt, handle and did.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
    - function:3b92f5560561f352bf01db889ca378c8
  - id: r.admin-auth
    level: MUST
    text: requireAdminAuth must reject with 401 AuthenticationRequired when no admin
      password is configured, when the Authorization header is not Basic, or when
      the decoded credentials are not user "admin" with the configured password, and
      otherwise call next().
    codeRefs:
    - function:12cc6ce1cb747a3667f3a8ef2fadfdf7
  - id: r.crawler-announce-requires-a-2xx
    level: MUST
    text: When the factory is given crawlers and a public hostname, a write announces
      the repo to each crawler with POST /xrpc/com.atproto.sync.requestCrawl. An announce
      is complete only when the crawler answers 2xx. A non-2xx response, a network
      error or a timeout leaves that crawler unannounced, and the factory announces
      to it again on a later write -- with a bounded backoff between attempts, so
      a crawler that is down is retried, not hammered, and never given up on for the
      life of the process. A crawler that has answered 2xx is announced once and not
      again, because the firehose carries the rest and a repeat announce makes a relay
      reset its cursor. The announce never blocks the write that triggered it and
      never fails it, and a failed announce never leaves an unhandled rejection.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
  - id: r.factory-options-contract
    level: MUST
    text: createRepoFactory must build a Repo over the injected storage, signer and
      optional did, defaulting the did to signer.did(), defaulting the sequencer to
      a new FirehoseSequencer, and defaulting the logger to createLogger("pds") when
      the optional options are absent.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
    - function:3b92f5560561f352bf01db889ca378c8
    - interface:07662ba591afb7adbc3f084fcfd2254c
  - id: r.factory-result-shape
    level: MUST
    text: createRepoFactory must return a RepoFactory exposing the Hono app, the subscribe
      handler, the repo api, the sequencer, an optional sessionInjector present only
      when oauthServer is enabled, and a getUserSigner lookup that maps an account
      DID to its Signer or undefined.
    codeRefs:
    - function:3b92f5560561f352bf01db889ca378c8
    - interface:7f38a4622a122cde3aedc658c6d7f484
  - id: r.identity-document
    level: MUST
    text: 'When didWebServices is non-empty the factory must serve /.well-known/did.json
      derived from the request Host header, emitting did:web:<host> with the atproto
      and attestation Multikey verification methods built from publicKeyDid and attestationKeyDid,
      the multikey context only when verification methods exist, the configured alsoKnownAs
      when non-empty, and each service with its id normalized to a #-prefixed fragment
      and a https://<host> serviceEndpoint; a missing Host header must raise an InvalidRequest.'
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
    - function:3b92f5560561f352bf01db889ca378c8
  - id: r.issuer-resolution
    level: MUST
    text: resolveIssuer must derive the requesting issuer from the request headers,
      returning a string usable to attribute the caller.
    codeRefs:
    - function:74a83283e66ddd78814ad23ab8491bf1
  - id: r.module-exports
    level: MUST
    text: mod.ts must re-export the factory surface so consumers import the module
      entrypoint rather than individual files.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/mod.ts
  - id: r.readonly-guard
    level: SHOULD
    text: When readOnly is set, the factory must answer 404 on the credential-minting
      routes (createAccount, createSession, refreshSession, createInviteCode, createInviteCodes,
      admin.getInviteCodes, getServiceAuth) by registering an all-method notFound
      guard rather than gating each route, leaving the repo write routes under requireAuth.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
    - function:3b92f5560561f352bf01db889ca378c8
    - interface:07662ba591afb7adbc3f084fcfd2254c
  - id: r.repo-routes
    level: MUST
    text: mountRepoRoutes must attach the repo api's read and write XRPC routes to
      the given Hono app, taking the RepoApi contract as its source of handlers.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/repo-handlers.ts
    - function:9f323ef8cfc4c2aec3f2c6d52a43cb4a
  - id: r.request-auth
    level: MUST
    text: requireAuth must accept an already-validated DPoP session by reading oauthUserDid
      and setting requesterDid, otherwise extract the Bearer token and try a service
      auth token verified against the factory DID with the lxm taken from the /xrpc/
      path suffix and a hosted-account predicate, then fall back to legacy access
      JWT validation, and return 401 AuthenticationRequired when all three fail.
    codeRefs:
    - function:e468b70406135c44ce7c00717ba47aef
  - id: r.sequencer-frames
    level: MUST
    text: FirehoseSequencer must assign monotonically increasing sequence numbers
      to firehose frames, producing a SequencedFrame from a CommitEvent via append,
      from a DID and optional handle via appendIdentity, and from a DID, active flag
      and optional status via appendAccount.
    codeRefs:
    - class:0358cb2ffa8565f9d4cf74dee43f2c2e
    - method:1304b3d01823f926c35cddd0cf3f6f04
    - method:62ec1d7d3af726f14822c8c5c63f7fa2
    - method:c6c8e631b702ca84ae0260ef580265f1
  - id: r.sequencer-streams
    level: MUST
    text: FirehoseSequencer must expose backfill, which replays retained frames as
      an async iterable from an optional since sequence number, and live, which yields
      subsequently appended frames as an async iterable.
    codeRefs:
    - method:2ec31de8f5799aa6438da1681f2fe590
    - method:ee74976464b4798bd9ede8cd366cf125
  - id: r.service-auth-handler
    level: MUST
    text: handleGetServiceAuth must return 400 InvalidRequest when the aud query parameter
      is missing, select the signer from the DPoP-authenticated user's registered
      signer when available and otherwise fall back to the factory signer or a Bearer-resolved
      signer, and use the optional lxm and exp query parameters when minting the token.
    codeRefs:
    - function:4a6197b7bae76874106795909fed1a5b
    - function:74a83283e66ddd78814ad23ab8491bf1
  - id: r.session-routes
    level: MUST
    text: createSession must require identifier and password (400 InvalidRequest when
      absent), reject invalid credentials with 401, and return freshly minted accessJwt/refreshJwt
      with the account handle and did; refreshSession must require a Bearer token,
      validate it as a refresh JWT and return new tokens with the current account
      handle, rejecting missing or invalid tokens with 401.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/factory.ts
    - function:3b92f5560561f352bf01db889ca378c8
  - id: r.subscribe-handler
    level: MUST
    text: createSubscribeHandler must build a SubscribeHandler from the given Sequencer
      so firehose subscribers are served from the sequencer's backfill and live streams.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/subscribe.ts
    - function:9bc40adeddb1771c452af7d31ee99b7f
  - id: r.sync-routes
    level: MUST
    text: mountSyncRoutes must register the sync endpoints on the given Hono app using
      the supplied SyncHandlerOptions, which carry the dependencies the sync handlers
      need.
    codeRefs:
    - file:lib/hono-factory-atproto-repo-deno/sync-handlers.ts
    - function:e74f80ecb4ebb358a2c874afb7ab378e
    - interface:14e3099fa1f0a95707a0951a37fbd296
