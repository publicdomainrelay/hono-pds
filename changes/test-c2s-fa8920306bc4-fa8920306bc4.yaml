    to mint an account, pulls that account''s signer out of the factory, and signs
    a token whose audience is the PDS''s own DID, which is then sent as a Bearer credential.
    Both HTTP tests follow the same lifecycle shape — bind port 0, read the real port
    from the `onListen` callback, and tear the server down in a `finally` block by
    aborting an AbortController and awaiting `server.finished` — so no test leaves
    a listener behind.'
