  agentLog: lib/atproto-oauth-server-deno/mod.ts is the Deno implementation layer
    of the AT Protocol OAuth server contracts used by hono-pds. It provides in-memory,
    Web-Crypto-backed implementations of the TokenStore (JWT access/refresh pairs
    with DPoP cnf.jkt binding), SessionInjector (per-login P-256 DPoP keypair plus
    bound tokens and session data), DpopVerifier (proof parsing, htu/htm/ath/iat checks,
    signature verification and jti replay rejection), DpopNonceStore (per-origin rotating
    nonces with a grace window), AuthorizationCodeStore (PKCE S256 codes with single-use
    300s entries), ParStore (RFC 9126 request_uri entries with 60s TTL) and client-metadata
    resolution with private_key_jwt client assertion verification. Everything is memory-resident
    and relies on crypto.subtle, so the module is transport-agnostic and is wired
    into the repo factory elsewhere.
