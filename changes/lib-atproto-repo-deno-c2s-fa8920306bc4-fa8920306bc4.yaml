  agentLog: lib/atproto-repo-deno is the Deno-native implementation layer of the atproto
    repository abstraction. It provides three interchangeable Storage backends (MemoryStorage,
    DenoKvStorage, IndexedDbStorage) that all key content-addressed blocks by Cid
    and per-account heads by Did, a Repo class that implements the RepoApi contract
    on top of a Storage plus a Signer and serves describe/getRecord/listRecords/applyWrites,
    CARv1 export and import helpers, service-auth JWT signing and verification, secp256k1
    signer/verifier factories, and an AccountStore interface with its AccountRecord
    shape that the Hono factory layer wires up. mod.ts re-exports the package surface,
    and deno.json carries the package manifest that the code index does not cover.
