  agentLog: 'lib/common/oauth-server-common/mod.ts is a shared helper module for the
    AT Protocol OAuth server stack in hono-pds. It exports three functions and one
    session-data type: generateDpopNonce wraps crypto.randomUUID to mint DPoP nonces,
    b64url encodes raw bytes to unpadded base64url, computeJkt derives the RFC 7638
    SHA-256 JWK thumbprint of a public key, and OAuthSessionData describes the persisted
    OAuth session (access and refresh JWTs, user DID, handle, PDS URL, and the DPoP
    public/private JWK pair). The module sits in the common layer, so both the abc
    OAuth server interfaces and the atproto-oauth-server-deno implementation import
    from it rather than duplicating this crypto and encoding logic.'
