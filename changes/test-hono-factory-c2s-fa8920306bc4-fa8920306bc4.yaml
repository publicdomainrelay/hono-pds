  agentLog: 'The context holds the end-to-end test suite for the Hono AT Protocol
    repo factory, contained in a single Deno test file, test/hono-factory/e2e_test.ts.
    Each test builds a factory with createRepoFactory({ storage: new MemoryStorage(),
    signer }) from a Secp256k1 keypair, creates an account through the /xrpc/com.atproto.server.createAccount
    route, and then drives the factory either through HTTP requests against factory.app
    (the Hono app) or directly through factory.api.applyWrites and factory.subscribe.
    The suite exercises createRecord, getRecord, listRecords, describeRepo, the subscribe
    callback contract over SequencedFrame, and the invariant that a write''s returned
    cid is the record cid rather than the commit cid, so strongRefs minted from writes
    match what reads return. Authentication is service-auth JWTs minted per request
    via signServiceAuth against factory.getUserSigner(did), since those tokens are
    not reusable across calls.'
